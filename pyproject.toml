[project]
name = "magi-system"
version = "0.1.0"
description = "MAGI System: autonomous, policy-bounded multi-agent software change platform (LangGraph)"
authors = [
    { name = "Lorenzo Girardi", email = "l@k8s.it" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
langfuse = ["langfuse>=3"]

[project.scripts]
magi = "magi_system.cli:app"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
