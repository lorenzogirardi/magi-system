# Run settings for `magi run --config settings.yaml`. Contains NO secrets:
# provider API keys are read from the environment (e.g. ANTHROPIC_API_KEY).
budget:
  max_architecture_rounds: 2      # initial round + 1 bounded revision
  max_fixes_per_finding: 2
  max_remediation_cycles: 3
  max_technical_retries: 2
  max_duration_seconds: 3600
  max_tool_calls: 500
  max_llm_calls: 200
  max_tokens: 2000000             # enforced only when the provider reports usage
  # max_cost_usd: 20              # enforced only when the provider reports cost

default_agent:
  provider: anthropic
  model: claude-opus-5
  temperature: 0.0
  max_output_tokens: 8192
  timeout_seconds: 180

# Per-agent overrides (internal ids). Different models do not remove common-mode errors;
# tool-based verification does.
agents:
  magi.balthasar: {provider: anthropic, model: claude-sonnet-5-5}
  magi.casper: {provider: anthropic, model: claude-sonnet-5-5}
  dev.pair: {provider: anthropic, model: claude-sonnet-5-5}

langfuse: false   # true mirrors redacted events to Langfuse (LANGFUSE_* env vars, `langfuse` extra)
